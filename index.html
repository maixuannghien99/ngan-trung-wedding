<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Cưới Ngân & Trung</title>
    <!-- Nhúng font chữ chuyên dụng -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Vietnamese:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fdfdfd; font-family: 'Noto Serif Vietnamese', serif; overflow-x: hidden; }
        
        section { 
            min-height: 100vh; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            text-align: center; 
        }

        /* --- SECTION 1: HERO (ẢNH BÌA) --- */
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), 
                        url('https://w.ladicdn.com/s1000x1200/6422976ce1b15300125bb011/test-1-20260503054736-ayxt5.jpeg') no-repeat center center; 
            background-size: cover; 
            padding: 0;
        }

        /* 1. Đoạn thơ trên cùng */
        .hero-quote { 
            position: absolute; 
            top: 40px; 
            width: 100%; 
            font-family: 'Montserrat', sans-serif; 
            font-size: 10px; 
            color: white; 
            line-height: 1.8; 
            letter-spacing: 1px; 
            font-weight: 300;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* 2. Chữ welcome đưa lên cao gần đoạn thơ */
        .hero-welcome { 
            position: absolute;
            top: 110px; /* Vị trí cao dưới đoạn thơ */
            width: 100%;
            font-family: 'Montserrat', sans-serif; 
            font-size: 26px; 
            text-transform: lowercase; 
            font-weight: 400; 
            letter-spacing: 2px;
            color: white;
        }

        /* 3. Chữ "We got married" CHÍNH GIỮA, TO, XÉO, ĐỔ BÓNG */
        .hero-married { 
            position: absolute;
            top: 50%; /* Nằm đúng giữa chiều cao */
            left: 50%; 
            transform: translate(-50%, -50%) rotate(-12deg); /* Căn giữa và xoay xéo */
            width: 100%;
            font-family: 'Dancing Script', cursive; 
            font-size: 60px; /* Kích thước to nổi bật */
            color: #ffecec; 
            text-shadow: 3px 3px 10px rgba(0,0,0,0.4); /* Đổ bóng nhẹ sang trọng */
            z-index: 2;
        }

        /* 4. Tên 2 người ở dưới */
        .hero-names { 
            position: absolute; 
            bottom: 110px; 
            width: 90%; 
            display: flex; 
            justify-content: space-between; 
            color: white;
            padding: 0 15px;
        }
        .hero-names h2 { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 400; }
        .hero-names p { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 4px; opacity: 0.9; }

        /* 5. Ngày tháng & Footer bar */
        .hero-date { position: absolute; bottom: 70px; color: white; font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 300; letter-spacing: 3px; }
        .hero-footer { position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; background: white; display: flex; justify-content: space-around; align-items: center; z-index: 5; }
        .hero-footer span { font-family: 'Montserrat', sans-serif; font-size: 11px; color: #333; letter-spacing: 3px; }

        /* --- SECTION 2: LỊCH (ẢNH VTV) --- */
        .calendar-section { 
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), 
                        url('https://cdn-images.vtv.vn/2022/3/31/hyun-bin-son-ye-jin-1-1648700983181444118815.jpeg') no-repeat center center; 
            background-size: cover; color: white; padding: 60px 20px;
        }
        .glass-box { background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); padding: 25px; border-radius: 20px; width: 100%; max-width: 320px; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; font-size: 13px; margin-top: 15px; }
        .special-date { position: relative; font-weight: bold; }
        .heart-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff4757; font-size: 32px; z-index: -1; }
        #countdown { display: flex; gap: 8px; margin-top: 20px; }
        .time-box { background: rgba(142, 42, 42, 0.9); color: white; width: 62px; padding: 10px 0; border-radius: 8px; }

        /* --- ĐIỀU KHIỂN NỔI --- */
        #music-btn { position: fixed; top: 20px; right: 20px; width: 42px; height: 42px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10001; cursor: pointer; backdrop-filter: blur(5px); }
        #music-img { width: 28px; height: 28px; animation: spin 4s linear infinite; animation-play-state: paused; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .playing #music-img { animation-play-state: running; }

        #wish-toggle-wrapper { position: fixed; bottom: 90px; right: 15px; display: flex; flex-direction: column; align-items: center; z-index: 10001; cursor: pointer; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2)); }
        .avatar-circle { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #ff5e78; overflow: hidden; background: white; z-index: 2; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .toggle-button-pink { width: 40px; height: 75px; background: #ff5e78; border-radius: 20px; margin-top: -28px; padding-top: 35px; display: flex; align-items: center; justify-content: center; z-index: 1; color: white; font-weight: bold; }
        
        #global-wish-container { position: fixed; bottom: 85px; left: 0; width: 100%; height: 25vh; pointer-events: none; z-index: 10; overflow: hidden; mask-image: linear-gradient(to top, transparent, black 15%, black 85%, transparent); -webkit-mask-image: linear-gradient(to top, transparent, black 15%, black 85%, transparent); }
        .wish-bubble { position: absolute; width: 86%; left: 7%; background: rgba(223, 137, 137, 0.95); padding: 12px 15px; border-radius: 12px; color: white; font-size: 13px; opacity: 0; transition: opacity 0.6s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .wishes-hidden #global-wish-container { display: none; }

        /* --- SECTION 3 & 4 --- */
        .wish-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; width: 90%; margin-bottom: 40px; }
        .wish-box input, .wish-box textarea { width: 100%; display: block; margin-bottom: 10px; padding: 12px; border: 1px solid #eee; border-radius: 10px; outline: none; font-family: inherit; background: #f9f9f9; }
        .wish-box button { width: 100%; background: #8e2a2a; color: white; border: none; padding: 15px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .rsvp-glass { background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.2)); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.4); border-radius: 30px; padding: 40px 25px; width: 90%; max-width: 450px; z-index: 2000; }
    </style>
</head>
<body>

    <div id="global-wish-container"></div>

    <div id="music-btn" onclick="toggleMusic()">
        <img id="music-img" src="https://cdn-icons-png.flaticon.com/512/461/461238.png">
    </div>

    <div id="wish-toggle-wrapper" onclick="toggleWishes()">
        <div class="avatar-circle">
            <img src="https://w.ladicdn.com/s250x250/6422976ce1b15300125bb011/test-1-20260503054736-ayxt5.jpeg">
        </div>
        <div class="toggle-button-pink"><span id="toggle-icon">✕</span></div>
    </div>

    <audio id="wedding-music" loop>
        <source src="https://www.dropbox.com/scl/fi/10p8durb1q6g5f4pwgntk/Beautiful-In-White_tainhacchuong.org.mp3?rlkey=5plnyt2zakjmigky9ziszvspj&st=mrc8w13n&dl=1" type="audio/mpeg">
    </audio>

    <!-- SECTION 1: HERO -->
    <section class="hero">
        <div class="hero-quote">
            I love three things in this world., Sun, moon and you.<br>
            Sun for morning moon for night,<br>
            and you forever.
        </div>
        
        <div class="hero-welcome">welcome to our wedding</div>
        
        <div class="hero-married">We got married</div>

        <div class="hero-names">
            <div style="text-align: left;">
                <h2>Ngân</h2>
                <p>BRIDE</p>
            </div>
            <div style="text-align: right;">
                <h2>Trung</h2>
                <p>GROOM</p>
            </div>
        </div>

        <div class="hero-date">2026.06.27</div>

        <div class="hero-footer">
            <span>WEDDING</span>
            <span>INVITATION</span>
            <span>2026</span>
        </div>
